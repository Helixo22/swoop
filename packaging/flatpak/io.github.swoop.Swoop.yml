        sha256: 481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8

  - name: python3-build-backend
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation hatchling-1.33.0-py3-none-any.whl packaging-26.3-py3-none-any.whl pathspec-1.1.1-py3-none-any.whl pluggy-1.7.0-py3-none-any.whl trove_classifiers-2026.9.21.13-py3-none-any.whl
    cleanup:
      - '*'
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/32/64/4afe5dd77b2939a93e8c9513f8082dbd049ecba9c1484a379a0f6ae29d6b/hatchling-1.33.0-py3-none-any.whl
        sha256: 415290b84f464d2884303fca8974d38e7b85579069fab02a15db0828fbb1446d
      - type: file
        url: https://files.pythonhosted.org/packages/63/34/ba1c580383c9eada3711951fef0795c80b829a078d72188184bcab9dd527/packaging-26.3-py3-none-any.whl
        sha256: d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
