        sha256: 7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec
      - type: file
        url: https://files.pythonhosted.org/packages/30/81/0da8afb52a71d0a4f2bd3152357b1a441e393b286374802b9d3addab4ab5/trove_classifiers-2026.9.21.13-py3-none-any.whl
        sha256: 8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17

  - name: swoop
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-index --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 src/swoop/data/io.github.swoop.Swoop.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 packaging/flatpak/io.github.swoop.Swoop.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - mkdir -p ${FLATPAK_DEST}/share/icons
      - cp -r src/swoop/ui/icons/hicolor ${FLATPAK_DEST}/share/icons/
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - .git
          - tests
