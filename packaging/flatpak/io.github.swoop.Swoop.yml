# Flatpak manifest for Swoop: GTK4/libadwaita app with aria2 bundled.
# Build: flatpak-builder --user --install build-dir packaging/flatpak/io.github.swoop.Swoop.yml
# Python dependencies are pinned wheels (runtime ones match uv.lock).
app-id: io.github.swoop.Swoop
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: swoop
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download
modules:
  - name: aria2
    config-opts:
      - --with-openssl
      - --without-gnutls
      - --without-libuv
      - --disable-nls
      - --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt
    cleanup:
      - /share/doc
      - /share/man
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b

  - name: python3-httpx
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation httpx-0.28.1-py3-none-any.whl httpcore-1.0.9-py3-none-any.whl h11-0.16.0-py3-none-any.whl idna-3.20-py3-none-any.whl certifi-2026.10.23-py3-none-any.whl anyio-4.15.1-py3-none-any.whl typing_extensions-4.16.0-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/2a/39/e50c7c3a983047577ee07d2a9e53faf5a69493943ec3f6a384bdc792deb2/httpx-0.28.1-py3-none-any.whl
        sha256: d909fcccc110f8c7faf814ca82a9a4d816bc5a6dbfea25d6591d6985b8ba59ad
      - type: file
        url: https://files.pythonhosted.org/packages/7e/f5/f66802a942d491edb555dd61e3a9961140fd64c90bce1eafd741609d334d/httpcore-1.0.9-py3-none-any.whl
        sha256: 2d400746a40668fc9dec9810239072b40b4484b640a8c38fd654a024c7a1bf55
      - type: file
        url: https://files.pythonhosted.org/packages/04/4b/29cac41a4d98d144bf5f6d33995617b185d14b22401f75ca86f384e87ff1/h11-0.16.0-py3-none-any.whl
        sha256: 63cf8bbe7522de3bf65932fda1d9c2772064ffb3dae62d55932da54b31cb6c86
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/32/d1/a3652fe2c19134d0d15922177821d863cbd7e842d53a21bbe7e8e3a1b5ac/certifi-2026.10.23-py3-none-any.whl
        sha256: e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
