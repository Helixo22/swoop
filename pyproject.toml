[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swoop"
version = "0.1.0"
description = "Download manager for Linux powered by aria2"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# PyGObject (GLib/Gio, later GTK4 + libadwaita) comes from the system or the Flatpak runtime.
dependencies = ["httpx>=0.27"]

[project.scripts]
swoop = "swoop.cli:main"
swoop-native-host = "swoop.native_host:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pygobject-stubs>=2.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110", "S603", "S607"]  # tests poll and launch local processes

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a real aria2c binary"]
# PyGObject 3.56 still calls the asyncio policy API deprecated in Python 3.14.
filterwarnings = ["ignore::DeprecationWarning:gi.events"]
