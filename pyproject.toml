[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swoop"
version = "0.1.0"
description = "Download manager for Linux powered by aria2"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110"]  # tests poll external processes

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires a real aria2c binary"]
